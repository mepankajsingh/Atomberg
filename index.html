<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atomberg Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <md-icon-button id="menu-btn"><md-icon>menu</md-icon></md-icon-button>
        <h1 class="title">Atomberg Home</h1>
        <div class="actions">
          <md-icon-button id="settings-btn"><md-icon>settings</md-icon></md-icon-button>
          <md-icon-button id="refresh-btn"><md-icon>refresh</md-icon></md-icon-button>
        </div>
      </header>
      
      <main class="content">
        <!-- Auth status or loading indicator -->
        <div id="status-container" class="status-container">
          <md-circular-progress indeterminate id="loader"></md-circular-progress>
          <p id="status-text">Authenticating...</p>
          <md-filled-button id="setup-btn" style="display: none;">Setup API Keys</md-filled-button>
        </div>

        <!-- Devices Grid -->
        <div id="devices-container" class="devices-grid" style="display: none;">
          <!-- Device cards will be injected here -->
        </div>
      </main>

      <!-- Settings Dialog -->
      <md-dialog id="settings-dialog">
        <div slot="headline">
          <md-icon slot="icon">settings</md-icon>
          API Configuration
        </div>
        <form slot="content" id="settings-form" method="dialog" style="display: flex; flex-direction: column; gap: 20px; margin-top: 16px; padding-bottom: 8px;">
          <p style="margin: 0; font-size: 0.875rem; color: var(--md-sys-color-on-surface-variant); line-height: 1.5; text-align: left;">
            Enter your Atomberg credentials to control your devices. These are stored securely in your browser's local storage.
          </p>
          <md-outlined-text-field
            id="api-key-input"
            label="X-API-Key"
            placeholder="Required"
            required
            spellcheck="false"
          >
            <md-icon slot="leading-icon">vpn_key</md-icon>
          </md-outlined-text-field>
          <md-outlined-text-field
            id="refresh-token-input"
            label="Refresh Token"
            placeholder="Bearer token"
            type="password"
            required
          >
            <md-icon slot="leading-icon">token</md-icon>
          </md-outlined-text-field>
        </form>
        <div slot="actions">
          <md-text-button form="settings-form" value="cancel">Cancel</md-text-button>
          <md-filled-button form="settings-form" value="save">Save Changes</md-filled-button>
        </div>
      </md-dialog>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
